name: Deploy to GitHub Pages

on:
  push:
    # Окружение github-pages пускает деплой ТОЛЬКО с ветки по умолчанию.
    # Сейчас главная — claude/leo-wend-bio-site-3g9o7p. После переключения
    # главной ветки на main замените значение ниже на [main].
    branches: [claude/leo-wend-bio-site-3g9o7p]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Требует, чтобы Pages был включён: Settings → Pages → Source: GitHub Actions
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
